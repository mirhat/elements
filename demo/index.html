<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planer kuhinje – demo</title>
  <style>
    body { margin: 0; background: #f4f2ee; color: #23262a; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .shop-bar { padding: 14px 20px; background: #23262a; color: #fff; font-weight: 600; }
    main { max-width: 1440px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { margin: 0 0 4px; font-size: 26px; }
    .note { margin: 0 0 18px; color: #6a6f76; font-size: 14px; }
    h2 { margin: 32px 0 8px; font-size: 17px; }
    pre { max-height: 320px; overflow: auto; padding: 12px; background: #fff; border: 1px solid #e3e0d9; border-radius: 8px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="shop-bar">Demo prodavnica namještaja</div>
  <main>
    <h1>Složi svoju kuhinju</h1>
    <p class="note">Cijene na ovoj stranici su izmišljene, samo za demo. Prave cijene se predaju kroz opciju <code>prices</code> ili <code>getPrice</code>.</p>

    <div id="planer"></div>

    <h2>Zadnji upit (onCheckout)</h2>
    <pre id="log">Klikni "Pošalji upit" u planeru.</pre>
  </main>

  <script src="katalog.js"></script>
  <script src="../src/kitchen-planner.js"></script>
  <script>
    window.planer = KitchenPlanner.create({
      container: '#planer',
      elements: window.KP_ELEMENTS,
      storageKey: 'demo',
      // DEMO cijene – izmišljene
      getPrice: el => el.type === 'plinth'
        ? Math.round(el.width * 0.09)
        : Math.round(35 + el.width * 1.4 + el.height * 0.7),
      onCheckout(order) {
        document.getElementById('log').textContent = JSON.stringify(order, null, 2);
      },
    });
  </script>
</body>
</html>
